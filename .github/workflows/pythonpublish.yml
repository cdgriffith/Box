# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [ created ]

jobs:
  deploy-generic:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    # Isolated build: Cython is not part of the build requirements, so this is the pure Python sdist and wheel
    - name: Build and Publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}

      run: |
        uv build
        uvx twine==6.2.0 upload dist/*

  deploy-cython:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
    - name: Use the matrix interpreter for uv
      shell: bash
      run: echo "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
    - name: Install build dependencies
      run: |
        uv venv
        uv pip install "setuptools>=77" wheel "Cython>=3.3.0"
    - name: Build and publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      # No build isolation so the Cython installed above is used to build the compiled wheel
      run: |
        uv build --wheel --no-build-isolation
        uvx twine==6.2.0 upload dist/*

  # Building runs the test suite (third party test dependencies), so it happens in a job without
  # access to the PyPI credentials. A separate job only downloads the built wheels and uploads them.
  build-cython-manylinux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    # Build targets and test commands are configured in [tool.cibuildwheel] in pyproject.toml
    - name: Build wheels
      run: uvx cibuildwheel==4.3.5 --output-dir dist

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v7
      with:
        name: python_box_manylinux
        path: dist/*-manylinux*.whl

  deploy-cython-manylinux:
    needs: build-cython-manylinux
    runs-on: ubuntu-latest
    steps:
    - name: Download wheels
      uses: actions/download-artifact@v7
      with:
        name: python_box_manylinux
        path: dist

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    - name: Publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        uvx twine==6.2.0 upload dist/*-manylinux*.whl
