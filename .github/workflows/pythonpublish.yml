# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [ created ]

jobs:
  deploy-generic:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'

    - name: Install uv
      uses: astral-sh/setup-uv@v10

    # Isolated build: Cython is not part of the build requirements, so this is the pure Python sdist and wheel
    - name: Build and Publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}

      run: |
        uv build
        uvx twine upload dist/*

  deploy-cython:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v10
    - name: Install build dependencies
      run: |
        uv venv
        uv pip install "setuptools>=77" wheel "Cython>=3.3.0"
    - name: Build and publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      # No build isolation so the Cython installed above is used to build the compiled wheel
      run: |
        uv build --wheel --no-build-isolation
        uvx twine upload dist/*

  deploy-cython-manylinux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10

    # Build targets and test commands are configured in [tool.cibuildwheel] in pyproject.toml
    - name: Build wheels
      run: uvx cibuildwheel --output-dir dist

    - name: Publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        uvx twine upload dist/*-manylinux*.whl
