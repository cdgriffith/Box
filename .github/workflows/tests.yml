# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
  push:
    branches: [ test, tests ]
  pull_request:
    branches: [ master, development, develop, test, tests ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx ruff@0.17.3 check .
      - name: Ruff format
        run: uvx ruff@0.17.3 format --check .

  package-checks:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", "pypy-3.11"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Use the matrix interpreter for uv
        shell: bash
        run: echo "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: Install dependencies
        # Cython is part of the dev group, so the build below produces a compiled wheel
        run: uv sync --group dev --no-install-project
      - name: Run mypy
        if: "!startsWith(matrix.python-version, 'pypy')"
        run: uv run --no-sync mypy box
      - name: Build sdist and wheel and check distribution log description
        run: |
          uv build --no-build-isolation
          uv run --no-sync twine check dist/*
      - name: Test packaged wheel on *nix
        if: matrix.os != 'windows-latest'
        run: |
          uv pip install --reinstall dist/*.whl
          rm -rf box
          uv run --no-sync pytest -vv
      - name: Test packaged wheel on Windows
        if: matrix.os == 'windows-latest'
        run: |
          $wheel = (Get-ChildItem dist\*.whl | Sort lastWriteTime | Select-Object -last 1).Name
          uv pip install --reinstall dist\${wheel}
          Remove-item box -recurse -force
          uv run --no-sync pytest -vv
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: python_box_${{matrix.os}}_${{ matrix.python-version }}
          path: dist/*.whl

  package-manylinux-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      # Build targets and test commands are configured in [tool.cibuildwheel] in pyproject.toml
      - name: Build wheels
        run: uvx cibuildwheel==4.3.5 --output-dir dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: python_box_manylinux
          path: dist/*-manylinux*.whl

  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true
    - name: Use the matrix interpreter for uv
      shell: bash
      run: echo "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
    - name: Install dependencies
      run: |
        uv sync --group dev --no-install-project
        # Editable install without build isolation compiles box in place using the Cython from the dev group
        uv pip install -e . --no-build-isolation
    - name: Test with pytest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run --no-sync pytest --cov=box -vv test/
