# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Tests

on:
  push:
    branches: [ test, tests ]
  pull_request:
    branches: [ master, development, develop, test, tests ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx ruff@0.17.3 check .
      - name: Ruff format
        run: uvx ruff@0.17.3 format --check .

  coverage:
    # Pure Python on purpose: Cython compiled modules can't be traced by coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --python "${{ steps.setup-python.outputs.python-path }}" --group test --no-install-project
      - name: Require 100% line and branch coverage
        run: uv run --no-sync pytest --cov=box --cov-branch --cov-report=term-missing --cov-fail-under=100 test/

  package-checks:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", "pypy-3.11"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        # Cython is part of the dev group, so the build below produces a compiled wheel
        run: uv sync --python "${{ steps.setup-python.outputs.python-path }}" --group dev --no-install-project
      - name: Run mypy
        if: "!startsWith(matrix.python-version, 'pypy')"
        run: uv run --no-sync mypy box
      - name: Build sdist and wheel and check distribution log description
        run: |
          uv build --no-build-isolation
          uv run --no-sync twine check dist/*
      - name: Test packaged wheel on *nix
        if: matrix.os != 'windows-latest'
        run: |
          uv pip install --reinstall dist/*.whl
          rm -rf box
          uv run --no-sync pytest -vv
      - name: Test packaged wheel on Windows
        if: matrix.os == 'windows-latest'
        run: |
          $wheel = (Get-ChildItem dist\*.whl | Sort lastWriteTime | Select-Object -last 1).Name
          uv pip install --reinstall dist\${wheel}
          Remove-item box -recurse -force
          uv run --no-sync pytest -vv
      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python_box_${{matrix.os}}_${{ matrix.python-version }}
          path: dist/*.whl

  package-manylinux-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      # Build targets and test commands are configured in [tool.cibuildwheel] in pyproject.toml
      - name: Build wheels
        run: uvx cibuildwheel==4.3.5 --output-dir dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python_box_manylinux
          path: dist/*-manylinux*.whl

  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        enable-cache: true
    - name: Install dependencies
      run: |
        uv sync --python "${{ steps.setup-python.outputs.python-path }}" --group dev --no-install-project
        # Editable install without build isolation compiles box in place using the Cython from the dev group
        uv pip install -e . --no-build-isolation
    - name: Test with pytest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        uv run --no-sync pytest --cov=box -vv test/
